version_extractors:
  - name: git
    provider: shell
    shell:
      command: printf '0.1.%s.%s' $(git log -1 --format='%cd %h' --date=format:'%Y%m%d%H%M%S')

common: &common
  package_name: "esp32dif-sink"
  maintainer: "Oleg Antonyan <oleg.b.antonyan@gmail.com>"
  homepage: "https://github.com/olegantonyan/esp32dif"
  description: "PipeWire sink that streams RTP audio to the esp32dif S/PDIF receiver"

ignore_source_files:
  - .git
  - .env
  - /build
  - /.cache
  - /managed_components
  - /components
  - /main
  - /docs
  - /CMakeLists.txt
  - /Makefile
  - /dependencies.lock
  - /sdkconfig
  - /sdkconfig.defaults
  - /tools
  - /partitions.csv
  - /.github

repositories:
  - name: "Linux packages"
    provider: s3
    gpg_private_key_base64: "${GPG_PRIVATE_KEY_BASE64}"
    <<: *common
    retain_packages: 3
    s3:
      bucket: repositories
      path_in_bucket: "esp32dif"
      bucket_public_url: "https://repositories.omnipackage.org"
      endpoint: "${CLOUDFLARE_R2_ENDPOINT}"
      access_key_id: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
      secret_access_key: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
      region: auto
      force_path_style: true
      cloudflare_zone_id: "${CLOUDFLARE_ZONE_ID}"
      cloudflare_api_token: "${CLOUDFLARE_API_TOKEN}"

rpm: &rpm
  <<: *common
  build_dependencies: [systemd-rpm-macros]
  runtime_dependencies: [pipewire, curl, playerctl, nss-mdns]
  rpm:
    spec_template: ".omnipackage/specfile.spec.liquid"

deb: &deb
  <<: *common
  build_dependencies: []
  runtime_dependencies: [pipewire, curl, playerctl, libnss-mdns]
  deb:
    debian_templates: ".omnipackage/deb"

pacman: &pacman
  <<: *common
  build_dependencies: []
  runtime_dependencies: [pipewire, curl, playerctl, nss-mdns]
  pacman:
    pkgbuild_template: ".omnipackage/PKGBUILD.liquid"

builds:
  - { distro: "opensuse_tumbleweed", <<: *rpm }
  - { distro: "opensuse_16.1", <<: *rpm }
  - { distro: "fedora_44", <<: *rpm }
  - { distro: "fedora_45", <<: *rpm }
  - { distro: "debian_13", <<: *deb }
  - { distro: "ubuntu_24.04", <<: *deb }
  - { distro: "ubuntu_26.04", <<: *deb }
  - { distro: "arch", <<: *pacman }
  - { distro: "manjaro", <<: *pacman }
