name: Linux packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - pipewire/esp32dif-sink
      - pipewire/esp32dif-sink.service
      - '.omnipackage/**'
      - .github/workflows/omnipackage.yml

jobs:
  list-distros:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.get-distros.outputs.distros }}
    steps:
      - uses: omnipackage/omnipackage-rs@master
      - uses: actions/checkout@v6
      - id: get-distros
        run: echo "distros=$(omnipackage info --list-distros . --format json)" >> "$GITHUB_OUTPUT"

  release:
    needs: [list-distros]
    runs-on: ubuntu-latest
    concurrency:
      group: omnipackage-${{ matrix.distro }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.list-distros.outputs.distros) }}
    steps:
      - uses: omnipackage/omnipackage-rs@master
      - uses: actions/checkout@v6
      - run: printf '%s\n' "$DOTENV" > .env
        env:
          DOTENV: ${{ secrets.OMNIPACKAGE_DOTENV }}
      - run: omnipackage release . --build-dir $RUNNER_TEMP --repository "Linux packages" --distros "${{ matrix.distro }}"
